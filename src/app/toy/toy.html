@if (toy()){

  <nav aria-label="breadcrumb" class="mt-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a class="text-decoration-none link-body-emphasis" routerLink="/">Home</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">
        {{toy()?.name}}
      </li>
    </ol>
  </nav>

  <div class="row">
    <div class="col-12 col-md-4">
      <img style="border-radius: 6px" [src]="`https://raw.githubusercontent.com/Pequla/express-toys-api/refs/heads/main/src/public${toy()?.imageUrl}`" [alt]="toy()?.name" class="img-fluid">
    </div>
    <div class="col-12 col-md-8" >
      <div class="card" style="height: 416px">
        <div class="card-header pink-subtle pink" style="background: rgb(185 32 107 / 0.1)">
          <h4>{{toy()?.name}}</h4>
        </div>
        <div class="card-body d-flex flex-column justify-content-center mb-3">
          <h6>Description </h6>
          <p class="mb-4">{{toy()?.description}}</p>
          <div class="row">
            <div class="col-12 col-md-6">
              <h6>Age Group - {{toy()!.ageGroup.name}}</h6>
              <p>{{toy()!.ageGroup.description}}</p>
            </div>
            <div class="col-12 col-md-6">
              <h6>Toy type - {{toy()!.type.name}}</h6>
              <p>{{toy()!.type.description}}</p>
            </div>
          </div>
        </div>
        <div class="card-footer d-flex justify-content-between" style="background: rgb(185 32 107 / 0.1) ">
          <h4 class="">{{toy()?.price}}.00 RSD</h4>
          <form class="d-flex gap-2" [formGroup]="cart_form" (ngSubmit)="onSubmit()">
            <div class="input-group" style="width: 140px;">
              <button class="btn btn-light border" type="button" (click)="decrement()">
                <i class="fa-solid fa-minus"></i>
              </button>
              <input type="number" class="form-control text-center border-start-0 border-end-0 bg-white" formControlName="quantity" readonly>
              <button class="btn btn-light border" type="button" (click)="increment()">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
            <a class="btn btn-success" [routerLink]="`/toy/${toy()?.permalink}/reservation`">
              <i class="fa-solid fa-cart-shopping" style="color: rgb(255, 255, 255);"></i> Add to cart
            </a>
          </form>


        </div>
      </div>
    </div>
  </div>
}
