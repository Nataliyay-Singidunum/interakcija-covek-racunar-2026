version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Use action hello world
  steps:
    - intent: hello_world
    - action: action_hello_world

- rule: Show new toys
  steps:
      - intent: new_toys
      - action: action_new_toys

- rule: Show all toys
  steps:
    - intent: all_toys
    - action: action_all_toys

- rule: Add to cart
  steps:
    - intent: add_to_cart
    - action: action_add_to_cart

- rule: Show cart
  steps:
    - intent: show_cart
    - action: action_show_cart

- rule: Order toys
  steps:
    - intent: order_toys
    - action: action_order_toys

- rule: Search movies
  steps:
    - intent: search_movies
    - action: action_search_movies

- rule: Recommend movies
  steps:
    - intent: latest_movies
    - action: action_latest_movies

- rule: List genres
  steps:
    - intent: genre_list
    - action: action_genre_list

- rule: List actors
  steps:
    - intent: actor_list
    - action: action_actor_list

- rule: List directors
  steps:
    - intent: director_list
    - action: action_director_list

# debug
- rule: List cinemas
  steps:
    - intent: list_cinema
    - action: action_list_cinema


